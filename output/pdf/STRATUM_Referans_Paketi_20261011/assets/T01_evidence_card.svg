<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>Bir iddia. Bir kanıt. Açık bir sınır.</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2C8F7D"/></marker></defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#FAFBFA" stroke="#FAFBFA"/><rect x="0" y="0" width="1920" height="12" rx="0" fill="#E4AD31" stroke="#E4AD31"/><text x="82" y="70" font-family="Candara, sans-serif" font-size="23" font-weight="400" fill="#17313F">STRATUM / T01 / EDITLENEBİLİR YERLEŞİM ŞABLONU</text><text x="82" y="168" font-family="Candara, sans-serif" font-size="56" font-weight="700" fill="#17313F">Bir iddia. Bir kanıt. Açık bir sınır.</text><rect x="82" y="244" width="1100" height="620" rx="22" fill="#EAF3F6" stroke="#CFDCE2"/><text x="128" y="321" font-family="Candara, sans-serif" font-size="31" font-weight="700" fill="#17313F">[KANITLANMIŞ İDDIA]</text><text x="128" y="515" font-family="Candara, sans-serif" font-size="118" font-weight="700" fill="#17313F">[METRİK]</text><text x="128" y="618" font-family="Candara, sans-serif" font-size="32" font-weight="400" fill="#17313F">[Birim + iş yükü + sembol / TF / pencere]</text><text x="128" y="699" font-family="Candara, sans-serif" font-size="29" font-weight="400" fill="#17313F">[Tarih / veri hazır mı / ölçüm yöntemi]</text><rect x="1226" y="244" width="612" height="620" rx="22" fill="#F8F2E4" stroke="#CFDCE2"/><text x="1265" y="321" font-family="Candara, sans-serif" font-size="31" font-weight="700" fill="#17313F">KANIT SINIRI</text><text x="1265" y="404" font-family="Candara, sans-serif" font-size="29" font-weight="400" fill="#17313F">[Ne ölçüldü?]</text><text x="1265" y="477" font-family="Candara, sans-serif" font-size="29" font-weight="400" fill="#17313F">[Ne ölçülmedi?]</text><text x="1265" y="550" font-family="Candara, sans-serif" font-size="29" font-weight="400" fill="#17313F">[Kaynak ID / rapor]</text><text x="1265" y="623" font-family="Candara, sans-serif" font-size="29" font-weight="400" fill="#17313F">[Genelleme sınırı]</text><text x="82" y="1007" font-family="Candara, sans-serif" font-size="23" font-weight="400" fill="#17313F">[KAYNAK + TARİH]    /    [HISTORICAL, SENTETİK veya GERÇEK UI ETİKETİ]</text><text x="82" y="1045" font-family="Candara, sans-serif" font-size="22" font-weight="400" fill="#17313F">Yerleşim şablonudur. Köşeli parantezler doğrulanmış içerikle değiştirilmelidir.</text></svg>