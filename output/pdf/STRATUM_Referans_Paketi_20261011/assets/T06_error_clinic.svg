<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>Mesajı oku. Kontrol et. Sonucu doğrula.</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2C8F7D"/></marker></defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#FAFBFA" stroke="#FAFBFA"/><rect x="0" y="0" width="1920" height="12" rx="0" fill="#E4AD31" stroke="#E4AD31"/><text x="82" y="70" font-family="Candara, sans-serif" font-size="23" font-weight="400" fill="#17313F">STRATUM / T06 / EDITLENEBİLİR YERLEŞİM ŞABLONU</text><text x="82" y="168" font-family="Candara, sans-serif" font-size="56" font-weight="700" fill="#17313F">Mesajı oku. Kontrol et. Sonucu doğrula.</text><rect x="82" y="244" width="1756" height="150" rx="22" fill="#F8F2E4" stroke="#CFDCE2"/><text x="123" y="307" font-family="Candara, sans-serif" font-size="40" font-weight="700" fill="#17313F">[GERÇEK HATA MESAJI]</text><text x="123" y="358" font-family="Candara, sans-serif" font-size="29" font-weight="400" fill="#17313F">Başarı varsayma. Mesajı görünür tut.</text><rect x="82" y="438" width="566" height="420" rx="22" fill="#EAF3F6" stroke="#CFDCE2"/><text x="112" y="512" font-family="Candara, sans-serif" font-size="28" font-weight="700" fill="#17313F">1 / OLASI SEBEP</text><text x="112" y="622" font-family="Candara, sans-serif" font-size="27" font-weight="400" fill="#17313F">[Kanıta bağlı hipotez]</text><text x="112" y="717" font-family="Candara, sans-serif" font-size="27" font-weight="400" fill="#17313F">[Aynı görünüm, farklı neden]</text><rect x="677" y="438" width="566" height="420" rx="22" fill="#EAF3F6" stroke="#CFDCE2"/><text x="707" y="512" font-family="Candara, sans-serif" font-size="28" font-weight="700" fill="#17313F">2 / KONTROL</text><text x="707" y="622" font-family="Candara, sans-serif" font-size="27" font-weight="400" fill="#17313F">[Somut kullanıcı adımı]</text><text x="707" y="717" font-family="Candara, sans-serif" font-size="27" font-weight="400" fill="#17313F">[Gerekli kaynak / veri]</text><rect x="1272" y="438" width="566" height="420" rx="22" fill="#EAF3F6" stroke="#CFDCE2"/><text x="1302" y="512" font-family="Candara, sans-serif" font-size="28" font-weight="700" fill="#17313F">3 / DOĞRULAMA</text><text x="1302" y="622" font-family="Candara, sans-serif" font-size="27" font-weight="400" fill="#17313F">[Başarı göstergesi]</text><text x="1302" y="717" font-family="Candara, sans-serif" font-size="27" font-weight="400" fill="#17313F">[Çözülmediyse doğru durum]</text><text x="82" y="1007" font-family="Candara, sans-serif" font-size="23" font-weight="400" fill="#17313F">[KAYNAK + TARİH]    /    [HISTORICAL, SENTETİK veya GERÇEK UI ETİKETİ]</text><text x="82" y="1045" font-family="Candara, sans-serif" font-size="22" font-weight="400" fill="#17313F">Yerleşim şablonudur. Köşeli parantezler doğrulanmış içerikle değiştirilmelidir.</text></svg>