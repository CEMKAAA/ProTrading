<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>Stratejiyi yalnız WR ile değerlendirme</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2C8F7D"/></marker></defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#FAFBFA" stroke="#FAFBFA"/><rect x="0" y="0" width="1920" height="12" rx="0" fill="#E4AD31" stroke="#E4AD31"/><text x="82" y="70" font-family="Candara, sans-serif" font-size="23" font-weight="400" fill="#17313F">STRATUM / T05 / EDITLENEBİLİR YERLEŞİM ŞABLONU</text><text x="82" y="168" font-family="Candara, sans-serif" font-size="56" font-weight="700" fill="#17313F">Stratejiyi yalnız WR ile değerlendirme</text><rect x="82" y="244" width="1756" height="138" rx="22" fill="#F8F2E4" stroke="#CFDCE2"/><text x="123" y="302" font-family="Candara, sans-serif" font-size="34" font-weight="700" fill="#17313F">[STRATEJİ ADI] / [AİLE] / [SEMBOL + TF]</text><text x="123" y="350" font-family="Candara, sans-serif" font-size="28" font-weight="400" fill="#17313F">[Pencere + cutoff] / [Legacy veya Independent] / [MEGA veya Current]</text><rect x="82" y="430" width="566" height="300" rx="22" fill="#EAF3F6" stroke="#CFDCE2"/><text x="112" y="495" font-family="Candara, sans-serif" font-size="28" font-weight="700" fill="#17313F">W / L / O / DATA</text><text x="112" y="617" font-family="Candara, sans-serif" font-size="64" font-weight="700" fill="#17313F">[DEĞER]</text><rect x="677" y="430" width="566" height="300" rx="22" fill="#EAF3F6" stroke="#CFDCE2"/><text x="707" y="495" font-family="Candara, sans-serif" font-size="28" font-weight="700" fill="#17313F">WR + kapalı N</text><text x="707" y="617" font-family="Candara, sans-serif" font-size="64" font-weight="700" fill="#17313F">[DEĞER]</text><rect x="1272" y="430" width="566" height="300" rx="22" fill="#EAF3F6" stroke="#CFDCE2"/><text x="1302" y="495" font-family="Candara, sans-serif" font-size="28" font-weight="700" fill="#17313F">NET R + MINCUM</text><text x="1302" y="617" font-family="Candara, sans-serif" font-size="64" font-weight="700" fill="#17313F">[DEĞER]</text><rect x="82" y="774" width="1756" height="138" rx="22" fill="#E7F4EF" stroke="#CFDCE2"/><text x="123" y="834" font-family="Candara, sans-serif" font-size="31" font-weight="700" fill="#17313F">[Seçim kuralı + gerçek/benzetim + kaynak + sınır]</text><text x="123" y="879" font-family="Candara, sans-serif" font-size="29" font-weight="400" fill="#17313F">Geriye dönük örnek seçimi, bağımsız forward başarı kanıtı değildir.</text><text x="82" y="1007" font-family="Candara, sans-serif" font-size="23" font-weight="400" fill="#17313F">[KAYNAK + TARİH]    /    [HISTORICAL, SENTETİK veya GERÇEK UI ETİKETİ]</text><text x="82" y="1045" font-family="Candara, sans-serif" font-size="22" font-weight="400" fill="#17313F">Yerleşim şablonudur. Köşeli parantezler doğrulanmış içerikle değiştirilmelidir.</text></svg>