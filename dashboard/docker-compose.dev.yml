# ProTrading Dashboard - Development Docker Compose Configuration
version: '3.8'

services:
  # Backend API Service (Development)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: protrading-backend-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./data:/app/dashboard/data
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=sqlite:///./dashboard/data/trading.db
      - LOG_LEVEL=DEBUG
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173
    command: uvicorn dashboard.backend.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - protrading-network-dev

  # Frontend Development Server
  frontend:
    image: node:20-alpine
    container_name: protrading-frontend-dev
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    networks:
      - protrading-network-dev

networks:
  protrading-network-dev:
    driver: bridge
